services:
  - type: web
    name: mediamate-telegram-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
